name: publicar

# Dispara quando uma tag de versao (v1.0, v0.9, etc.) e empurrada — nunca
# em push comum. Fecha a historia de DevOps: o workflow "ci" (ci.yml)
# VERIFICA a cada push/PR; este aqui PUBLICA so quando uma versao e
# marcada de verdade.
on:
  push:
    tags:
      - "v*"

jobs:
  publicar-imagem:
    name: Build e push para o ghcr.io
    runs-on: ubuntu-latest
    permissions:
      # So o token do proprio repositorio autentica no ghcr.io — nenhuma
      # credencial de terceiro precisa ser cadastrada como secret.
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem em minusculas
        # ghcr.io (como qualquer registro Docker) exige nome em
        # minusculas — github.repository preserva "NutriCasa2050" como
        # esta no GitHub, maiusculas e tudo, e o push falharia com
        # "repository name must be lowercase" sem este passo.
        id: imagem
        run: echo "nome=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Metadados da imagem (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imagem.outputs.nome }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
