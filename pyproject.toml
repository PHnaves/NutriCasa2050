# Metadados do pacote + configuracao das ferramentas (ruff e pytest).
# As dependencias ficam nos requirements*.txt, nao aqui, para o Docker
# conseguir instala-las antes de copiar o codigo (cache de camadas).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutricasa2050"
version = "0.1.0"
description = "Simulacao NutriCasa 2050"
requires-python = ">=3.11"

# Layout "src": o codigo mora em src/nutricasa2050/, nao na raiz. Evita
# importar o pacote por acidente sem ele estar instalado.
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F = erros e estilo basico, I = ordem dos imports, UP = sintaxe moderna.
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
